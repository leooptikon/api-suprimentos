<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="caixa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3e45"/><stop offset=".55" stop-color="#1c1e22"/><stop offset="1" stop-color="#0f1013"/>
    </linearGradient>
    <linearGradient id="tampa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4f57"/><stop offset="1" stop-color="#16181b"/>
    </linearGradient>
    <linearGradient id="cilindro" x1="0" x2="1">
      <stop offset="0" stop-color="#0c0d0f"/><stop offset=".38" stop-color="#3b3f46"/><stop offset=".55" stop-color="#25282d"/><stop offset="1" stop-color="#0c0d0f"/>
